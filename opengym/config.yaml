name: openGym
version: "1.2.7"
slug: opengym
description: >-
  Self-hosted gym & body-weight tracker: weekly plans, guided workouts,
  progression tracking, estimated 1RM and passkey login. Built from source
  from DuarteSantos/openGym (AGPL-3.0), since upstream only publishes
  separate web/api images for docker-compose rather than a single add-on
  image.
url: "https://gitea.com/DuarteSantos/openGym"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
webui: "http://[HOST]:[PORT:8099]/"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "openGym web UI"
options:
  rp_id: localhost
  origin: "http://localhost:8099"
  rp_name: openGym
  session_days: 90
  admin_uids: ""
  invite_only: false
  allow_guest: true
  vapid_subject: ""
  download_media: true
schema:
  rp_id: str
  origin: url
  rp_name: str
  session_days: int(1,3650)
  admin_uids: str
  invite_only: bool
  allow_guest: bool
  vapid_subject: str?
  download_media: bool
